name: Packages

on:
  push:
    branches: [main]
    paths:
      - Jinxfile
      - jinx
      - recipes/**
      - host-recipes/**
      - base-files/**
      - build-support/**
  workflow_dispatch:

# Two runs publishing at once would race on the indexes.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # A token with write access to tuna4ll/tulpar-packs; GITHUB_TOKEN only reaches this repository.
      GH_TOKEN: ${{ secrets.PACKS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the runner
        run: |
          # Jinx builds in user namespaces, which Ubuntu's AppArmor blocks by default.
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h .

      - name: Set up the build directory
        run: |
          mkdir build-${{ matrix.arch }}
          cd build-${{ matrix.arch }}
          ../jinx init .. ARCH=${{ matrix.arch }}
          ../jinx rebuild-cache

      - name: Fetch the published packages
        run: ./build-support/fetch-repo.sh ${{ matrix.arch }}

      - name: Build what changed
        working-directory: build-${{ matrix.arch }}
        run: |
          # shellcheck disable=SC2046 # the closure is a list of names
          ../jinx update -b $(../jinx closure base desktop devel)

      - name: Publish
        env:
          XBPS_PRIVKEY_PEM: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          umask 077
          printf '%s\n' "${XBPS_PRIVKEY_PEM}" > "${RUNNER_TEMP}/xbps.pem"
          XBPS_PRIVKEY="${RUNNER_TEMP}/xbps.pem" ./build-support/publish-repo.sh ${{ matrix.arch }}
          rm -f "${RUNNER_TEMP}/xbps.pem"
