name: Release

# Publishing a release on GitHub builds a disk image for each architecture
# from the published packages and attaches it to that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build images for
        required: true

permissions:
  contents: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Prepare the runner
        run: |
          # Jinx builds in user namespaces, which Ubuntu's AppArmor blocks by default.
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get update -q && sudo apt-get install -yq mtools

      - name: Set up the build directory
        run: |
          mkdir build-${{ matrix.arch }}
          cd build-${{ matrix.arch }}
          ../jinx init .. ARCH=${{ matrix.arch }}
          ../jinx rebuild-cache

      - name: Fetch the published packages
        run: ./build-support/fetch-repo.sh ${{ matrix.arch }}

      - name: Build the image
        working-directory: build-${{ matrix.arch }}
        run: |
          ../build-support/makeimg.sh
          name="tulpar-${TAG#v}-${{ matrix.arch }}.img"
          mv tulpar.img "${name}"
          zstd -q -T0 -19 --rm "${name}"
          sha256sum "${name}.zst" > "${name}.zst.sha256"

      - name: Attach it to the release
        working-directory: build-${{ matrix.arch }}
        run: gh release upload "${TAG}" --clobber tulpar-*.img.zst tulpar-*.img.zst.sha256
