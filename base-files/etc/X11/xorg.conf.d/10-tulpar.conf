# Tunix has no udev: devices are named here. Its devfs gives fixed roles to
# /dev/input/event0 (keyboard), event1 (mouse) and event2 (tablet).
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

# Tunix's /dev/fb0 has only its own ioctls; X draws through DRM/KMS dumb buffers.
Section "Device"
    Identifier "card"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card0"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver     "evdev"
    Option     "Device" "/dev/input/event1"
EndSection

Section "InputDevice"
    Identifier "tablet"
    Driver     "evdev"
    Option     "Device" "/dev/input/event2"
EndSection

Section "ServerLayout"
    Identifier  "tulpar"
    Screen      "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "mouse" "CorePointer"
    InputDevice "tablet" "SendCoreEvents"
EndSection

Section "Screen"
    Identifier "screen"
    Device     "card"
EndSection
